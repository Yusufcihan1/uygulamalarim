<style>
  body { font-family: var(--font-family-body); }

  /* Efekt renkleri: her temaya kendi karakterine uygun üç canlı renk. */
  [data-astryx-theme="neutral"]   { --fx1: #8b5cf6; --fx2: #3b82f6; --fx3: #ec4899; }
  [data-astryx-theme="stone"]     { --fx1: #6366f1; --fx2: #0ea5e9; --fx3: #a78bfa; }
  [data-astryx-theme="matcha"]    { --fx1: #84cc16; --fx2: #10b981; --fx3: #eab308; }
  [data-astryx-theme="butter"]    { --fx1: #225bff; --fx2: #facc15; --fx3: #fb923c; }
  [data-astryx-theme="chocolate"] { --fx1: #d4a06a; --fx2: #f97316; --fx3: #e11d48; }
  [data-astryx-theme="gothic"]    { --fx1: #8aa1d8; --fx2: #7c3aed; --fx3: #14b8a6; }
  [data-astryx-theme="y2k"]       { --fx1: #ff4fd8; --fx2: #22d3ee; --fx3: #a3e635; }

  /* Sayfanın tepesinde akan ince renk çizgisi */
  .topline { position: fixed; inset: 0 0 auto 0; height: 2px; z-index: 1000; pointer-events: none;
    background: linear-gradient(90deg, var(--fx1), var(--fx2), var(--fx3), var(--fx1)); background-size: 200% 100%;
    animation: flow 6s linear infinite alternate; }

  /* Karşılama alanı: aurora, ızgara ve imleci izleyen ışık */
  .hero { position: relative; isolation: isolate; overflow: hidden; border-radius: var(--radius-page);
    padding: clamp(40px, 8vw, 88px) 16px clamp(36px, 6vw, 64px); }
  .aurora { position: absolute; inset: 0; z-index: -3; filter: blur(64px); opacity: .42;
    -webkit-mask-image: radial-gradient(ellipse 50% 60% at 50% 50%, #000 15%, transparent 100%); mask-image: radial-gradient(ellipse 50% 60% at 50% 50%, #000 15%, transparent 100%); }
  .aurora i { position: absolute; width: 34%; aspect-ratio: 1; border-radius: 50%; }
  .aurora i:nth-child(1) { background: var(--fx1); left: 18%; top: 0%; animation: drift1 16s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { background: var(--fx2); right: 16%; top: -10%; animation: drift2 19s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { background: var(--fx3); left: 38%; bottom: -10%; width: 28%; animation: drift3 22s ease-in-out infinite alternate; }
  .gridbg { position: absolute; inset: 0; z-index: -2;
    background-image: linear-gradient(color-mix(in srgb, var(--color-text-primary) 8%, transparent) 1px, transparent 1px),
                      linear-gradient(90deg, color-mix(in srgb, var(--color-text-primary) 8%, transparent) 1px, transparent 1px);
    background-size: 44px 44px; mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, #000 25%, transparent 75%); }
  .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .4s;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--fx2) 22%, transparent), transparent 65%); }
  .hero:hover::after { opacity: 1; }

  /* Üst menü: seçili sayfanın altında kayan vurgu (GSAP konumlar) */
  .astryx-top-nav-item, .astryx-top-nav-item:hover, .astryx-top-nav-item[aria-current] { background-color: transparent !important; position: relative; z-index: 1; }
  .astryx-top-nav-item { transition: color .3s; }
  @property --navang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes navspin { to { --navang: 360deg; } }
  .navrow { position: relative; padding: 4px; border-radius: 14px;
    background: color-mix(in oklab, var(--fx1) 8%, transparent); backdrop-filter: blur(10px);
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--fx1) 24%, transparent), 0 10px 30px -16px var(--fx1); }
  .navrow::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: conic-gradient(from var(--navang), transparent 0 62%, var(--fx1) 76%, var(--fx2) 86%, transparent 96%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    animation: navspin 7s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .navrow::before { animation: none; } }
  .navpill { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; border-radius: 10px; opacity: 0;
    background: linear-gradient(120deg, color-mix(in oklab, var(--fx1) 30%, transparent), color-mix(in oklab, var(--fx2) 22%, transparent));
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--fx1) 45%, transparent), 0 6px 22px -8px var(--fx1); }
  .navpill::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -7px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--fx1), var(--fx2), var(--fx3)); box-shadow: 0 0 10px var(--fx1); }

  /* Vitrin: seçimi gösteren kayan kart + otomatik geçiş çubuğu */
  .vitrin { position: relative; }
  .vitrin .astryx-list { position: relative; z-index: 1; }
  .vitrin .astryx-item, .vitrin .astryx-item:hover { background-color: transparent !important; }
  .vitrin .astryx-item { transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
  .vitrin .astryx-item:hover { transform: translateX(5px); }
  .vpill { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; border-radius: 12px; overflow: hidden; opacity: 0;
    background: linear-gradient(100deg, color-mix(in oklab, var(--fx1) 28%, transparent), color-mix(in oklab, var(--fx2) 12%, transparent) 65%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--fx1) 38%, transparent), 0 10px 30px -14px var(--fx1); }
  .vpill::before { content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px; border-radius: 3px;
    background: linear-gradient(var(--fx1), var(--fx2)); box-shadow: 0 0 10px var(--fx1); }
  .vbar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; transform-origin: left center; transform: scaleX(0);
    background: linear-gradient(90deg, var(--fx1), var(--fx2), var(--fx3)); }

  /* WebGL katmanları */
  .gridfx { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .gridfx canvas { display: block; width: 100%; height: 100%; }
  .astryx-app-shell { isolation: isolate; }
  .astryx-app-shell .astryx-layout-content { background-color: transparent; }
  .hero3d { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
  .hero3d canvas, .tile3d canvas { display: block; width: 100%; height: 100%; }
  .tile3d { position: absolute; inset: 0; cursor: grab; touch-action: pan-y; }
  .tile3d:active { cursor: grabbing; }
  @media (max-width: 700px) { .hero3d { opacity: .55; } }

  /* Akan renkli yazı */
  .grad { background: linear-gradient(90deg, var(--fx1), var(--fx2), var(--fx3), var(--fx1)); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 8s ease-in-out infinite alternate; }

  /* Kartlar: üzerine gelince yükselir, kenarında imleci izleyen renkli ışık */
  .spot { position: relative; height: 100%; border-radius: var(--radius-container); transition: box-shadow .4s; }
  .spot::before, .spot::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .35s; }
  .spot::before { z-index: 2; padding: 1.5px;
    background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0), var(--fx1), var(--fx2) 45%, transparent 75%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .spot::after { z-index: 1; background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 0), color-mix(in srgb, var(--fx1) 13%, transparent), transparent 65%); }
  .spot:hover { box-shadow: 0 22px 50px -24px color-mix(in srgb, var(--fx1) 60%, transparent); }
  .spot:hover::before, .spot:hover::after { opacity: 1; }

  .rise { animation: rise .8s cubic-bezier(.2, .8, .2, 1) backwards; }
  .rise-2 { animation-delay: .1s; } .rise-3 { animation-delay: .2s; } .rise-4 { animation-delay: .3s; }
  .swap { height: 100%; animation: swap .55s cubic-bezier(.2, .8, .2, 1); }

  /* Simge sahnesi: dönen renk halesi ve süzülen simge */
  .stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; isolation: isolate; }
  .halo { position: absolute; width: 62%; aspect-ratio: 1; border-radius: 50%; z-index: -1; opacity: .42; filter: blur(42px);
    background: conic-gradient(from 0deg, var(--fx1), var(--fx2), var(--fx3), var(--fx1)); animation: spin 14s linear infinite; }
  .float { display: inline-flex; animation: float 6s ease-in-out infinite;
    filter: drop-shadow(0 18px 28px color-mix(in srgb, var(--fx1) 45%, transparent)); }

  /* Birincil düğmeye ışık süzmesi */
  .shine { display: inline-block; will-change: transform; }
  .shine a, .shine button { position: relative; overflow: hidden; box-shadow: 0 10px 30px -12px var(--fx1); }
  .shine a::after, .shine button::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 30%, rgb(255 255 255 / .35) 50%, transparent 70%); transform: translateX(-120%); }
  .shine a:hover::after, .shine button:hover::after { transform: translateX(120%); transition: transform .8s ease; }

  .sw { display: inline-flex; padding-inline-start: 4px; }
  .sw i { width: 14px; height: 14px; border-radius: 50%; margin-inline-start: -4px; box-shadow: 0 0 0 2px var(--color-background-popover, var(--color-background-card)); }

  /* Sayfa geçişi (View Transitions): üst menü yerinde kalır, içerik kayarak değişir */
  .page-vt { view-transition-name: page; }
  html.vt-page::view-transition-old(root), html.vt-page::view-transition-new(root) { animation: none; }
  ::view-transition-group(page) { animation: none; }
  ::view-transition-old(page) { animation: page-out .22s ease-in both; }
  ::view-transition-new(page) { animation: page-in .5s cubic-bezier(.2, .8, .2, 1) .04s both; }
  /* Tema değişimi: tıklanan yerden yayılan daire */
  html.vt-reveal .page-vt { view-transition-name: none; }
  html.vt-reveal::view-transition-old(root) { animation: none; }
  html.vt-reveal::view-transition-new(root) { animation: reveal .75s cubic-bezier(.65, 0, .35, 1); }

  @keyframes flow { to { background-position: 100% 0; } }
  @keyframes drift1 { to { transform: translate(18%, 22%) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-22%, 18%) scale(.9); } }
  @keyframes drift3 { to { transform: translate(14%, -24%) scale(1.2); } }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.98); } }
  @keyframes swap { from { opacity: 0; transform: translateY(10px) scale(.985); filter: blur(6px); } }
  @keyframes spin { to { transform: rotate(1turn); } }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes page-out { to { opacity: 0; transform: translateY(-8px); filter: blur(4px); } }
  @keyframes page-in { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } }
  @keyframes reveal { from { clip-path: circle(0 at var(--vt-x) var(--vt-y)); } to { clip-path: circle(var(--vt-r) at var(--vt-x) var(--vt-y)); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  }
</style>

<noscript>Bu sayfa JavaScript ister. Dosyalar: <a href="https://github.com/Yusufcihan1/uygulamalarim/releases">GitHub Releases</a></noscript>

<script type="module">
import * as React from "react";
import { createRoot } from "react-dom/client";
import { flushSync } from "react-dom";
import htm from "htm";
// GSAP (https://gsap.com): tüm eklentiler ücretsiz. Kurallar greensock/gsap-skills'teki resmî rehberlerden.
import { gsap } from "gsap";
import { useGSAP } from "@gsap/react";
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { SplitText } from "gsap/SplitText";
import { ScrambleTextPlugin } from "gsap/ScrambleTextPlugin";
import { ScrollTrigger } from "gsap/ScrollTrigger";
gsap.registerPlugin(useGSAP, SplitText, ScrambleTextPlugin, ScrollTrigger);
import {
  AppShell, TopNav, TopNavHeading, TopNavItem, NavIcon, Icon, IconButton, Button, Badge,
  Card, ClickableCard, Grid, VStack, HStack, Layout, LayoutContent, Heading, Text, AspectRatio,
  SegmentedControl, SegmentedControlItem, MetadataList, MetadataListItem, CommandPalette,
  Table, EmptyState, CodeBlock, Code, Link, Divider, Skeleton, List, Item, Collapsible,
  CollapsibleGroup, Center, Banner, InternationalizationProvider, DropdownMenu, DropdownMenuRadioGroup, DropdownMenuRadioItem,
} from "@astryxdesign/core";
// Astryx'in kendi Türkçe çevirisi (palet, tablo, düğme metinleri).
import trTR from "https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.11/dist/i18n/generated-locales/tr-TR.generated.js";
// Neutral temasının simge ailesi Lucide; yalnızca kullanılanlar yüklenir.
import {
  LayoutGrid, Search, Sun, Moon, Download, ArrowRight, ArrowLeft, ArrowUpRight, Package,
  FolderArchive, ShieldCheck, RefreshCw, Trash2, MousePointerClick, KeyRound, Check, Palette, Tag, CalendarClock,
} from "https://esm.sh/lucide-react@1.60.0?external=react&exports=LayoutGrid,Search,Sun,Moon,Download,ArrowRight,ArrowLeft,ArrowUpRight,Package,FolderArchive,ShieldCheck,RefreshCw,Trash2,MousePointerClick,KeyRound,Check,Palette,Tag,CalendarClock";

const { useState, useEffect, useLayoutEffect, useMemo, useCallback, useRef } = React;
const html = htm.bind(React.createElement);
const REPO = "https://github.com/Yusufcihan1/uygulamalarim";

// ---------- biçimlendirme ----------
const fmtSize = (b) => b >= 1 << 30 ? (b / (1 << 30)).toFixed(1) + " GB" : (b / (1 << 20)).toFixed(1) + " MB";
const fmtDate = (d) => new Date(d).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
const fmtTime = (d) => new Date(d).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
const fmtNum = (n) => n.toLocaleString("tr-TR");
const appUrl = (a) => `#/uygulama/${encodeURIComponent(a.id)}`;
const lower = (s) => String(s ?? "").toLocaleLowerCase("tr");

const KINDS = {
  installer: ["Kurulum", "Kurulum sihirbazı açılır; yönetici izni gerekmez."],
  portable: ["Taşınabilir", "Zip dosyası: bir klasöre çıkar, içindeki exe'yi çalıştır."],
  zip: ["Zip", "Zip dosyası: bir klasöre çıkar."],
  exe: ["Taşınabilir", "Kurulum gerekmez, doğrudan çalıştır."],
};
const kindOf = (a) => KINDS[a.kind] || KINDS.installer;
const isPortable = (a) => a.kind && a.kind !== "installer";

// Simgeler: Astryx'te görsel bileşeni yok (AspectRatio şablonlarındaki gibi düz <img>, tema köşe yarıçapıyla).
const iconStyle = (size) => ({ width: size, height: size, objectFit: "contain", borderRadius: "var(--radius-container)", flexShrink: 0, display: "block" });
const AppIcon = ({ app, size = 40 }) => html`<img src=${app.icon} alt="" width=${size} height=${size} loading="lazy" style=${iconStyle(size)} />`;
const Ico = ({ icon, size = "sm", color }) => html`<${Icon} icon=${icon} size=${size} color=${color} />`;

// ---------- veri: apps.json + GitHub Releases ----------
// GitHub saatte 60 isteğe izin verdiği için sürüm listesi tarayıcıda 15 dakika saklanır.
const CACHE_KEY = "surumler-v1";
async function loadReleases() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (c && Date.now() - c.t < 15 * 60 * 1000) return c.d;
  } catch (_) { /* depolama kapalı olabilir */ }
  const r = await fetch("https://api.github.com/repos/Yusufcihan1/uygulamalarim/releases?per_page=100",
    { headers: { Accept: "application/vnd.github+json" } });
  if (!r.ok) throw new Error(r.status);
  const d = [];
  for (const rel of await r.json()) {
    const m = /^(.*)-v([\d.]+)$/.exec(rel.tag_name);
    if (!m || rel.draft) continue;
    d.push({ id: m[1], v: m[2], t: rel.published_at || rel.created_at,
             n: rel.assets.reduce((s, x) => s + (x.download_count || 0), 0) });
  }
  d.sort((a, b) => (a.t < b.t ? 1 : -1));
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d })); } catch (_) { /* yok say */ }
  return d;
}

// releases: null = yükleniyor, false = alınamadı, dizi = hazır
const downloadsOf = (releases, id) => Array.isArray(releases) ? releases.filter((r) => r.id === id).reduce((s, r) => s + r.n, 0) : 0;
const dlText = (releases, id) => releases == null ? "…" : fmtNum(downloadsOf(releases, id));

// ---------- yönlendirme: #/, #/uygulamalar, #/uygulama/<id>, #/kurulum, #/surumler ----------
const readPath = () => decodeURIComponent(location.hash.replace(/^#\/?/, ""));
function useRoute() {
  const [path, setPath] = useState(readPath);
  useEffect(() => {
    const on = () => {
      const next = readPath();
      const go = () => {
        flushSync(() => setPath(next));
        scrollerOf(document.querySelector(".page-vt")).scrollTo({ top: 0 });
      };
      transition("vt-page", go);
    };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  if (path.startsWith("uygulama/")) return { view: "app", id: path.slice(9) };
  return { view: { uygulamalar: "apps", kurulum: "guide", surumler: "releases" }[path] || "home" };
}

// ---------- açık / koyu tema ----------
function useScheme() {
  const media = window.matchMedia("(prefers-color-scheme: dark)");
  const resolve = () => document.documentElement.dataset.theme || (media.matches ? "dark" : "light");
  const [scheme, setScheme] = useState(resolve);
  useEffect(() => {
    const on = () => setScheme(resolve());
    media.addEventListener("change", on);
    return () => media.removeEventListener("change", on);
  }, []);
  const toggle = () => reveal(() => {
    const next = scheme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("tema", next); } catch (_) {}
    setScheme(next);
  });
  return [scheme, toggle];
}

// ---------- geçişler (View Transitions; desteklemeyen tarayıcıda ya da azaltılmış hareket tercihinde anında) ----------
const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function transition(cls, fn) {

  const root = document.documentElement;
  root.classList.add(cls);
  const t = document.startViewTransition(fn);
  t.finished.finally(() => root.classList.remove(cls));
}
// Tema değişimi son tıklanan noktadan daire olarak yayılır.
let lastPoint = null;
document.addEventListener("pointerdown", (e) => { lastPoint = { x: e.clientX, y: e.clientY }; }, true);
function reveal(fn) {
  const { x, y } = lastPoint || { x: innerWidth / 2, y: innerHeight / 2 };
  const s = document.documentElement.style;
  s.setProperty("--vt-x", x + "px");
  s.setProperty("--vt-y", y + "px");
  s.setProperty("--vt-r", Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + "px");
  transition("vt-reveal", () => flushSync(fn));
}

// Sayfanın kaydırılan kutusu (Astryx düzeninde içerik alanı; yoksa pencere). ScrollTrigger buna bağlanır.
function scrollerOf(el) {
  for (let n = el?.parentElement; n; n = n.parentElement) {
    if (/(auto|scroll)/.test(getComputedStyle(n).overflowY)) return n;
  }
  return window;
}

// Sayılar göründükleri anda sıfırdan yukarı sayar (GSAP tween + ScrollTrigger).
function CountUp({ value }) {
  const ref = useRef(null);
  const animate = typeof value === "number" && !reducedMotion();
  useGSAP(() => {
    if (!animate) return;
    const el = ref.current, o = { v: 0 };
    gsap.to(o, { v: value, duration: 1.6, ease: "power3.out",
      onUpdate: () => { el.textContent = fmtNum(Math.round(o.v)); },
      scrollTrigger: { trigger: el, scroller: scrollerOf(el), start: "top 95%", once: true } });
  }, { dependencies: [value], revertOnUpdate: true });
  return html`<span ref=${ref}>${animate ? "0" : typeof value === "number" ? fmtNum(value) : value}</span>`;
}

// Mıknatıslı düğmeler: imlece doğru hafifçe çekilir (gsap.quickTo, performans rehberindeki yöntem).
const magnets = new WeakMap();
let activeMagnet = null;
document.addEventListener("pointermove", (e) => {
  if (reducedMotion()) return;
  const el = e.target.closest?.(".shine");
  if (activeMagnet && activeMagnet !== el) { magnets.get(activeMagnet)?.(0, 0); activeMagnet = null; }
  if (!el) return;
  if (!magnets.has(el)) {
    const qx = gsap.quickTo(el, "x", { duration: 0.5, ease: "power3.out" });
    const qy = gsap.quickTo(el, "y", { duration: 0.5, ease: "power3.out" });
    magnets.set(el, (x, y) => { qx(x); qy(y); });
  }
  const r = el.getBoundingClientRect();
  magnets.get(el)((e.clientX - r.left - r.width / 2) * 0.3, (e.clientY - r.top - r.height / 2) * 0.4);
  activeMagnet = el;
}, { passive: true });

// ---------- 3B (Three.js) ----------
const webglOK = (() => { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (_) { return false; } })();

// Temanın vurgu renkleri ve koyu/açık durumu; 3B sahneler tema değişince bunu yeniden okur.
function sceneColors() {
  const cs = getComputedStyle(document.documentElement);
  const col = (n, d) => { try { return new THREE.Color(cs.getPropertyValue(n).trim() || d); } catch (_) { return new THREE.Color(d); } };
  // metin rengi light-dark() ile tanımlı; çözülmüş değeri görünmez bir öğeden okunur
  const probe = document.createElement("i"); probe.style.cssText = "position:absolute;visibility:hidden;color:var(--color-text-primary)";
  document.body.appendChild(probe); const rgb = getComputedStyle(probe).color; probe.remove();
  const text = new THREE.Color(); try { text.setStyle(rgb); } catch (_) { text.set("#fff"); }
  return { fx: [col("--fx1", "#8b5cf6"), col("--fx2", "#3b82f6"), col("--fx3", "#ec4899")], dark: text.r + text.g + text.b > 1.5 };
}

// Simgeyi yuvarlak köşeli bir dokuya çevirir (aynı simge bir kez yüklenir).
const iconTextures = new Map();
function iconTexture(src) {
  if (!iconTextures.has(src)) iconTextures.set(src, new Promise((done) => {
    const img = new Image();
    img.onload = () => {
      const n = 512, c = document.createElement("canvas"); c.width = c.height = n;
      const g = c.getContext("2d"); g.beginPath(); g.roundRect(0, 0, n, n, n * 0.2); g.clip(); g.drawImage(img, 0, 0, n, n);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; done(t);
    };
    img.onerror = () => done(null);
    img.src = src;
  }));
  return iconTextures.get(src);
}

// Cam gövdeli, önünde ve arkasında uygulama simgesi olan yuvarlak karo.
function makeTile(invalidate) {
  const tile = new THREE.Group();
  const body = new THREE.Mesh(new RoundedBoxGeometry(1, 1, 0.3, 6, 0.14), new THREE.MeshPhysicalMaterial({
    roughness: 0.25, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.12, iridescence: 0.7, iridescenceIOR: 1.35 }));
  const faceMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, toneMapped: false });
  const front = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.72), faceMat);
  front.position.z = 0.152;
  const back = new THREE.Mesh(front.geometry, faceMat);
  back.position.z = -0.152; back.rotation.y = Math.PI;
  tile.add(body, front, back);
  tile.setIcon = (src) => iconTexture(src).then((t) => { if (!t) return; faceMat.map = t; faceMat.opacity = 1; faceMat.needsUpdate = true; invalidate(); });
  tile.paint = ({ fx, dark }) => {
    body.material.color.copy(dark ? new THREE.Color("#0d0d16").lerp(fx[0], 0.28) : new THREE.Color("#ffffff").lerp(fx[0], 0.14));
    body.material.emissive.copy(fx[0]).multiplyScalar(dark ? 0.06 : 0);
  };
  return tile;
}

// Ortak sahne kurulumu: boyut, görünürlük (ekranda değilse çizmez), tema takibi ve temizlik.
// Üst menü: seçili sayfanın arkasında renkli bir vurgu durur, imleç başka sekmeye gelince oraya kayar.
function useNavPill(deps) {
  useLayoutEffect(() => {
    const first = document.querySelector(".astryx-top-nav .astryx-top-nav-item"); if (!first) return;
    const row = first.parentElement; row.classList.add("navrow");
    const items = [...row.querySelectorAll(".astryx-top-nav-item")];
    let pill = row.querySelector(":scope > .navpill");
    if (!pill) {
      pill = document.createElement("span"); pill.className = "navpill"; pill.setAttribute("aria-hidden", "true"); row.appendChild(pill);
      if (!reducedMotion()) gsap.from(items, { y: -16, autoAlpha: 0, duration: .7, ease: "back.out(2)", stagger: .09, delay: .15 });
    }
    const cur = () => row.querySelector('.astryx-top-nav-item[aria-current="page"]');
    const moveTo = (el, anim) => {
      if (!el) { gsap.to(pill, { autoAlpha: 0, duration: .25 }); return; }
      const v = { x: el.offsetLeft, y: el.offsetTop, width: el.offsetWidth, height: el.offsetHeight, autoAlpha: 1 };
      if (anim && !reducedMotion() && gsap.getProperty(pill, "opacity") > 0) gsap.to(pill, { ...v, duration: .5, ease: "expo.out", overwrite: true });
      else gsap.fromTo(pill, { ...v, autoAlpha: anim ? 0 : 1, scale: anim ? .85 : 1 }, { autoAlpha: 1, scale: 1, duration: anim ? .35 : 0, overwrite: true });
    };
    moveTo(cur(), !!pill.dataset.ready); pill.dataset.ready = "1";
    const enter = (e) => moveTo(e.currentTarget, true), leave = () => moveTo(cur(), true);
    items.forEach((i) => i.addEventListener("pointerenter", enter)); row.addEventListener("pointerleave", leave);
    const ro = new ResizeObserver(() => moveTo(cur(), false)); ro.observe(row);
    return () => { items.forEach((i) => i.removeEventListener("pointerenter", enter)); row.removeEventListener("pointerleave", leave); ro.disconnect(); };
  }, deps);
}

// Vitrin: seçili satırın arkasında kayan kart; 6 sn'de bir sıradaki uygulamaya geçer (alttaki çubuk süreyi gösterir).
// İmleç listedeyken ya da liste ekranda değilken durur; hareketi azaltma açıksa otomatik geçiş yok.
const SHOW_SEC = 6;
function useShowcase(box, index, onNext) {
  const pill = useRef(null), bar = useRef(null), tw = useRef(null), state = useRef({ hover: false, seen: true });
  const next = useRef(onNext); next.current = onNext;
  const sync = () => { const t = tw.current; if (!t) return; state.current.hover || !state.current.seen ? t.pause() : t.play(); };
  useLayoutEffect(() => {
    const b = box.current, p = pill.current; if (!b || !p) return;
    const it = b.querySelectorAll(".astryx-item")[index]; if (!it) return;
    const place = (anim) => {
      const r = it.getBoundingClientRect(), o = b.getBoundingClientRect();
      const v = { x: r.left - o.left, y: r.top - o.top, width: r.width, height: r.height, autoAlpha: 1 };
      anim && !reducedMotion() ? gsap.to(p, { ...v, duration: .6, ease: "expo.out", overwrite: true }) : gsap.set(p, v);
    };
    place(!!p.dataset.ready); p.dataset.ready = "1";
    const icon = it.querySelector("img, svg");
    if (icon && !reducedMotion()) gsap.fromTo(icon, { scale: .7, rotate: -12 }, { scale: 1, rotate: 0, duration: .7, ease: "back.out(3)" });
    const ro = new ResizeObserver(() => place(false)); ro.observe(b);
    return () => ro.disconnect();
  }, [index]);
  useEffect(() => {
    if (reducedMotion() || !bar.current) return;
    tw.current = gsap.fromTo(bar.current, { scaleX: 0 }, { scaleX: 1, duration: SHOW_SEC, ease: "none", onComplete: () => next.current() });
    sync();
    return () => { tw.current?.kill(); tw.current = null; };
  }, [index]);
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => { state.current.seen = e.isIntersecting; sync(); });
    io.observe(box.current); return () => io.disconnect();
  }, []);
  const hover = (v) => () => { state.current.hover = v; sync(); };
  return { pill, bar, onPointerEnter: hover(true), onPointerLeave: hover(false), onFocus: hover(true), onBlur: hover(false) };
}

function useThree(ref, setup, deps, { env = true } = {}) {
  useEffect(() => {
    const host = ref.current;
    if (!host || !webglOK) return;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    host.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const pmrem = env ? new THREE.PMREMGenerator(renderer) : null;
    if (pmrem) scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    const still = reducedMotion();
    const clock = new THREE.Clock();
    let raf = 0, visible = false, api = {};
    const frame = () => {
      raf = 0;
      if (!visible || document.hidden) return;
      api.update?.(clock.elapsedTime, Math.min(clock.getDelta(), 0.05));
      renderer.render(scene, camera);
      if (!still) raf = requestAnimationFrame(frame);
    };
    const invalidate = () => { if (!raf) { clock.getDelta(); raf = requestAnimationFrame(frame); } };
    api = setup({ scene, camera, renderer, host, invalidate, still });
    const size = () => {
      const w = host.clientWidth, h = host.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      api.resize?.(w, h); invalidate();
    };
    const theme = () => { api.theme?.(sceneColors()); invalidate(); };
    const ro = new ResizeObserver(size); ro.observe(host);
    const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; invalidate(); }); io.observe(host);
    const mo = new MutationObserver(theme); mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "data-astryx-theme"] });
    const mq = matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener("change", theme);
    document.addEventListener("visibilitychange", invalidate);
    size(); theme();
    return () => {
      cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); mo.disconnect();
      mq.removeEventListener("change", theme); document.removeEventListener("visibilitychange", invalidate);
      api.dispose?.();
      scene.traverse((o) => { o.geometry?.dispose(); [].concat(o.material || []).forEach((m) => m.dispose()); });
      scene.environment?.dispose(); pmrem?.dispose(); renderer.dispose(); renderer.forceContextLoss(); renderer.domElement.remove();
    };
  }, deps);
}

// Üç renkli ışık: temanın vurgu renkleriyle karoların cilasına renkli yansıma verir.
function addLights(scene) {
  const lights = [0, 1, 2].map(() => { const l = new THREE.PointLight(0xffffff, 18, 0, 2); scene.add(l); return l; });
  const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(2, 3, 5); scene.add(key);
  return {
    paint: ({ fx }) => lights.forEach((l, i) => l.color.copy(fx[i])),
    move: (t, r = 3) => lights.forEach((l, i) => { const a = t * 0.35 + i * 2.1; l.position.set(Math.cos(a) * r, Math.sin(a * 1.3) * r * 0.6, 2.2 + Math.sin(a) * 1.2); }),
  };
}

// Karşılama alanının 3B sahnesi: uygulama simgeleri cam karolar olarak süzülür, imleci izler, üzerine gelince döner,
// tıklayınca uygulamanın sayfası açılır. Arka planda temanın renklerinde yıldız tozu.
// Yuvalar: [x, y] alanın kenarına göre (-1..1), z derinlik, ölçek. Ortadaki yazıya değmezler.
const SLOTS_WIDE = [[-0.86, 0.5, 0.4, 1], [0.88, 0.46, -0.6, 1.05], [-0.84, -0.62, -1, 0.95], [0.86, -0.6, 0.4, 0.9], [-0.93, -0.04, -2.2, 0.95], [0.93, -0.06, -1.8, 0.95], [-0.64, 0.92, -2.6, 0.75], [0.66, 0.92, -2.8, 0.75]];
const SLOTS_TALL = [[-0.72, 0.84, 0, 0.62], [0.74, 0.8, -0.6, 0.66], [-0.76, -0.86, -0.4, 0.62], [0.76, -0.84, 0, 0.6], [0.02, -0.97, -1.6, 0.55], [-0.02, 0.97, -2, 0.5], [-0.95, 0, -2.4, 0.5], [0.95, 0, -2.4, 0.5]];
function Hero3D({ apps }) {
  const ref = useRef(null);
  useThree(ref, ({ scene, camera, host, invalidate, still }) => {
    const hero = host.parentElement;
    camera.position.set(0, 0, 9);
    const lights = addLights(scene);
    const world = new THREE.Group(); scene.add(world);
    const tiles = apps.slice(0, 8).map((a, i) => {
      const t = makeTile(invalidate); t.setIcon(a.icon);
      t.userData = { app: a, phase: i * 1.7, spin: { y: 0 }, pop: { s: still ? 1 : 0 }, hover: { s: 1 } };
      world.add(t); return t;
    });
    // yıldız tozu
    const N = 110, pos = new Float32Array(N * 3), cols = new Float32Array(N * 3), pick = [];
    for (let i = 0; i < N; i++) { pos.set([(Math.random() - 0.5) * 16, (Math.random() - 0.5) * 8, -Math.random() * 6], i * 3); pick.push(i % 3); }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3)); dustGeo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ size: 0.045, vertexColors: true, transparent: true, opacity: 0.45, depthWrite: false }));
    scene.add(dust);

    const layout = (w, h) => {
      const slots = w / h < 1 ? SLOTS_TALL : SLOTS_WIDE, tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      tiles.forEach((t, i) => {
        const [nx, ny, z, s] = slots[i % slots.length], half = tan * (camera.position.z - z);
        t.userData.base = new THREE.Vector3(nx * half * camera.aspect * 0.95, ny * half * 0.86, z);
        t.userData.scale = s * (w < 700 ? 0.8 : Math.min(1, Math.max(0.7, w / 1200)));
      });
    };
    // giriş: karolar dönerek belirir; kaydırınca sahne dağılıp yaklaşır
    const scroll = { p: 0 };
    const ctx = gsap.context(() => {
      if (still) return;
      tiles.forEach((t, i) => {
        gsap.to(t.userData.pop, { s: 1, duration: 1.3, ease: "back.out(1.6)", delay: 0.35 + i * 0.09 });
        gsap.from(t.userData.spin, { y: -Math.PI * 1.5, duration: 1.6, ease: "expo.out", delay: 0.35 + i * 0.09 });
      });
      gsap.to(scroll, { p: 1, ease: "none", scrollTrigger: { trigger: hero, scroller: scrollerOf(hero), start: "top top", end: "bottom top", scrub: 0.6 } });
    });
    // imleç: sahne hafifçe eğilir, üzerine gelinen karo döner, tıklayınca sayfası açılır
    const mouse = new THREE.Vector2(), aim = new THREE.Vector2(), ray = new THREE.Raycaster();
    let hovered = null;
    const hitTest = (e) => {
      const r = host.getBoundingClientRect();
      mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      if (e.target.closest("a, button")) return null;
      ray.setFromCamera(mouse, camera);
      let o = ray.intersectObjects(tiles, true)[0]?.object;
      while (o && !tiles.includes(o)) o = o.parent;
      return o || null;
    };
    const onMove = (e) => {
      const t = hitTest(e);
      if (t === hovered) return;
      if (hovered) gsap.to(hovered.userData.hover, { s: 1, duration: 0.5, ease: "power3.out" });
      if (t && !still) {
        gsap.to(t.userData.hover, { s: 1.18, duration: 0.5, ease: "back.out(2)" });
        gsap.to(t.userData.spin, { y: "+=" + Math.PI * 2, duration: 1.1, ease: "power3.out" });
      }
      hovered = t; hero.style.cursor = t ? "pointer" : "";
    };
    const onLeave = () => { mouse.set(0, 0); if (hovered) gsap.to(hovered.userData.hover, { s: 1, duration: 0.5 }); hovered = null; hero.style.cursor = ""; };
    const onClick = (e) => { const t = hitTest(e); if (t) location.hash = appUrl(t.userData.app); };
    hero.addEventListener("pointermove", onMove); hero.addEventListener("pointerleave", onLeave); hero.addEventListener("click", onClick);

    return {
      resize: layout,
      theme: (c) => {
        lights.paint(c); tiles.forEach((t) => t.paint(c));
        pick.forEach((k, i) => { const col = c.fx[k].clone(); if (!c.dark) col.multiplyScalar(0.8); cols.set([col.r, col.g, col.b], i * 3); });
        dustGeo.attributes.color.needsUpdate = true; dust.material.opacity = c.dark ? 0.45 : 0.3;
      },
      update: (t) => {
        aim.lerp(mouse, 0.06);
        world.rotation.y = aim.x * 0.22; world.rotation.x = -aim.y * 0.14;
        lights.move(t);
        tiles.forEach((tile) => {
          const u = tile.userData, b = u.base; if (!b) return;
          tile.position.set(b.x * (1 + scroll.p * 0.35), b.y + Math.sin(t * 0.8 + u.phase) * 0.14 + scroll.p * 1.2 * Math.sign(b.y || 1), b.z + scroll.p * 2.5);
          tile.rotation.set(Math.cos(t * 0.45 + u.phase) * 0.18 - aim.y * 0.3, Math.sin(t * 0.5 + u.phase) * 0.45 + u.spin.y + aim.x * 0.4, Math.sin(t * 0.3 + u.phase) * 0.06);
          tile.scale.setScalar(u.scale * u.pop.s * u.hover.s);
        });
        dust.rotation.y = t * 0.012; dust.position.y = Math.sin(t * 0.2) * 0.1 + scroll.p * 0.8;
      },
      dispose: () => {
        ctx.revert(); tiles.forEach((t) => gsap.killTweensOf([t.userData.pop, t.userData.spin, t.userData.hover]));
        hero.removeEventListener("pointermove", onMove); hero.removeEventListener("pointerleave", onLeave); hero.removeEventListener("click", onClick);
        hero.style.cursor = "";
      },
    };
  }, [apps.map((a) => a.id).join()]);
  return webglOK ? html`<div class="hero3d" ref=${ref} aria-hidden="true" />` : null;
}

// Tek simgenin 3B karosu: kendi kendine salınır, imleci izler, sürükleyerek çevrilir; simge değişince takla atarak yenisine geçer.
function Tile3D({ src, alt }) {
  const ref = useRef(null), tileRef = useRef(null), first = useRef(true);
  useThree(ref, ({ scene, camera, host, invalidate, still }) => {
    camera.position.set(0, 0, 3.4);
    const lights = addLights(scene);
    const tile = makeTile(invalidate); tile.setIcon(src); scene.add(tile);
    tileRef.current = tile;
    const st = { spin: 0, vel: 0, drag: false, lastX: 0, aim: new THREE.Vector2(), mouse: new THREE.Vector2(), flip: { y: 0 } };
    tile.userData.flip = st.flip;
    const box = host.closest(".stage") || host;
    const onMove = (e) => {
      const r = box.getBoundingClientRect();
      st.mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      if (st.drag) { const dx = e.clientX - st.lastX; st.lastX = e.clientX; st.vel = dx * 0.012; st.spin += st.vel; invalidate(); }
    };
    const onDown = (e) => { st.drag = true; st.lastX = e.clientX; host.setPointerCapture(e.pointerId); };
    const onUp = () => { st.drag = false; };
    const onLeave = () => st.mouse.set(0, 0);
    box.addEventListener("pointermove", onMove); box.addEventListener("pointerleave", onLeave);
    host.addEventListener("pointerdown", onDown); host.addEventListener("pointerup", onUp); host.addEventListener("pointercancel", onUp);
    if (!still) gsap.from(tile.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 1.2, ease: "back.out(1.7)", delay: 0.15 });
    return {
      theme: (c) => { lights.paint(c); tile.paint(c); },
      update: (t) => {
        st.aim.lerp(st.mouse, 0.08);
        if (!st.drag) { st.vel *= 0.94; st.spin += st.vel; st.spin *= 0.985; }
        lights.move(t, 2.2);
        tile.position.y = Math.sin(t * 0.9) * 0.06;
        tile.rotation.set(-st.aim.y * 0.45 + Math.cos(t * 0.6) * 0.08, st.aim.x * 0.6 + Math.sin(t * 0.5) * 0.3 + st.spin + st.flip.y, Math.sin(t * 0.4) * 0.04);
      },
      dispose: () => {
        gsap.killTweensOf([tile.scale, st.flip]); tileRef.current = null;
        box.removeEventListener("pointermove", onMove); box.removeEventListener("pointerleave", onLeave);
        host.removeEventListener("pointerdown", onDown); host.removeEventListener("pointerup", onUp); host.removeEventListener("pointercancel", onUp);
      },
    };
  }, []);
  // simge değişti: karo bir tam tur atar, arkası dönükken yeni simge yerleşir
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    const tile = tileRef.current; if (!tile) return;
    if (reducedMotion()) { tile.setIcon(src); return; }
    const flip = tile.userData.flip;
    gsap.to(flip, { y: flip.y + Math.PI * 2, duration: 1, ease: "power3.inOut" });
    const swap = gsap.delayedCall(0.35, () => tile.setIcon(src));
    return () => swap.kill();
  }, [src]);
  if (!webglOK) return html`<span class="float" style=${{ width: "45%", maxWidth: 128 }}><img src=${src} alt=${alt} style=${iconStyle("100%")} /></span>`;
  return html`<div class="tile3d" ref=${ref} role="img" aria-label=${alt} />`;
}

// Sayfanın tamamını kaplayan ızgara (tam ekran shader): çizgilerde temanın renklerinde kuyruklu ışıklar akar,
// kesişimler ara ara parlar, imlecin çevresi aydınlanır, kaydırınca ızgara yavaşça kayar (derinlik hissi).
// Ortadaki içerik alanında silikleşir, kenarlarda belirginleşir.
const GRID_FRAG = `
precision highp float;
uniform float uTime, uCell, uDpr, uScroll, uDark, uBoxL, uBoxR;
uniform vec2 uRes, uMouse;
uniform vec3 uFx1, uFx2, uFx3, uLine;
float hash(float n) { return fract(sin(n * 127.1) * 43758.5453); }
vec3 pick(float h) { return h < .34 ? uFx1 : h < .67 ? uFx2 : uFx3; }
// çizgi boyunca giden ışık: baş parlak, arkasında sönen kuyruk
float pulse(float along, float idx, float span) {
  float on = step(.78, hash(idx));   // çizgilerin yalnız küçük bir kısmında ışık
  float speed = mix(1.4, 3., hash(idx + 7.3));
  float dir = hash(idx + 3.1) > .5 ? 1. : -1.;
  float len = span + 30.;
  float head = mod(uTime * speed + hash(idx + 1.7) * len, len) - 15.;
  float t = (head - (dir > 0. ? along : span - along));
  float tail = t >= 0. ? exp(-t * .7) * (.55 + exp(-t * 6.)) : exp(t * 9.) * 1.4;
  return on * tail;
}
void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 g = p + vec2(0., uScroll * .35 * uDpr);
  vec2 cell = g / uCell;
  vec2 d = min(fract(cell), 1. - fract(cell)) * uCell;
  float w = uDpr;
  float lv = 1. - smoothstep(.5 * w, 1.5 * w, d.x), lh = 1. - smoothstep(.5 * w, 1.5 * w, d.y);
  float vx = floor(cell.x + .5), hy = floor(cell.y + .5);
  // kenarlarda belirgin, ortada silik
  float side = smoothstep(uBoxL + 40. * uDpr, uBoxL - 120. * uDpr, p.x) + smoothstep(uBoxR - 40. * uDpr, uBoxR + 120. * uDpr, p.x);
  float sideM = clamp(side, 0., 1.);
  float mask = mix(.12, 1., sideM);
  float near = exp(-distance(p, uMouse) / (220. * uDpr));
  float base = max(lv, lh) * ((uDark > .5 ? .27 : .12) + near * .3) * mask;
  // ışıklar
  float gw = 2.4 * uDpr;
  float pv = pulse(p.y / uCell, vx, uRes.y / uCell) * exp(-d.x / gw);
  float ph = pulse(p.x / uCell, hy + 91.7, uRes.x / uCell) * exp(-d.y / gw);
  float boost = (uDark > .5 ? 1.1 : .7) * sideM;   // ışıklar yalnız kenarlarda, ortada yok   // koyu zeminde renkler daha az öne çıkar
  pv *= boost; ph *= boost;
  vec3 col = uLine * base + pick(hash(vx + 5.)) * pv + pick(hash(hy + 11.)) * ph;
  float a = base + pv + ph;
  // çıktı önceden çarpılmış alfa: renk ve alfa aynı oranda ölçeklenir
  float k = a > 1. ? 1. / a : 1.;
  gl_FragColor = vec4(col * k, a * k);
}`;
function GridBG() {
  const ref = useRef(null);
  useThree(ref, ({ scene, renderer, invalidate, still }) => {
    const u = {
      uTime: { value: 0 }, uCell: { value: 44 }, uDpr: { value: 1 }, uScroll: { value: 0 }, uDark: { value: 1 },
      uBoxL: { value: 0 }, uBoxR: { value: 0 }, uRes: { value: new THREE.Vector2() }, uMouse: { value: new THREE.Vector2(-9999, -9999) },
      uFx1: { value: new THREE.Color() }, uFx2: { value: new THREE.Color() }, uFx3: { value: new THREE.Color() }, uLine: { value: new THREE.Color() },
    };
    const mat = new THREE.ShaderMaterial({ uniforms: u, transparent: true, depthTest: false, depthWrite: false, fragmentShader: GRID_FRAG,
      vertexShader: "void main() { gl_Position = vec4(position.xy, 0., 1.); }" });
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat); quad.frustumCulled = false; scene.add(quad);
    const dpr = () => renderer.getPixelRatio();
    const box = () => {
      const r = document.querySelector(".page-vt")?.getBoundingClientRect();
      u.uBoxL.value = (r ? r.left : innerWidth * 0.15) * dpr(); u.uBoxR.value = (r ? r.right : innerWidth * 0.85) * dpr();
    };
    let scroller = null;
    const onMove = (e) => { u.uMouse.value.set(e.clientX * dpr(), e.clientY * dpr()); if (still) invalidate(); };
    const onOut = () => u.uMouse.value.set(-9999, -9999);
    window.addEventListener("pointermove", onMove, { passive: true }); document.addEventListener("pointerleave", onOut);
    return {
      resize: (w, h) => { u.uRes.value.set(w * dpr(), h * dpr()); u.uDpr.value = dpr(); u.uCell.value = 44 * dpr(); box(); },
      theme: (c) => {
        u.uFx1.value.copy(c.fx[0]); u.uFx2.value.copy(c.fx[1]); u.uFx3.value.copy(c.fx[2]);
        u.uLine.value.set(c.dark ? "#ffffff" : "#000000"); u.uDark.value = c.dark ? 1 : 0;
      },
      update: (t) => {
        u.uTime.value = still ? 12 : t;
        if (!scroller?.isConnected) { const el = document.querySelector(".page-vt"); scroller = el ? scrollerOf(el) : null; if (scroller === window) scroller = null; }
        u.uScroll.value = scroller ? scroller.scrollTop : 0;
        if (Math.round(t * 60) % 30 === 0) box();
      },
      dispose: () => { window.removeEventListener("pointermove", onMove); document.removeEventListener("pointerleave", onOut); },
    };
  }, [], { env: false });
  return webglOK ? html`<div class="gridfx" ref=${ref} aria-hidden="true" />` : null;
}

// Kartlar imlece göre hafifçe 3B eğilir ve yükselir (gsap.quickTo).
const tilts = new WeakMap();
let activeTilt = null;
document.addEventListener("pointermove", (e) => {
  if (reducedMotion() || e.pointerType !== "mouse") return;
  const el = e.target.closest?.(".spot");
  if (activeTilt && activeTilt !== el) { tilts.get(activeTilt)?.(0, 0, 0); activeTilt = null; }
  if (!el) return;
  if (!tilts.has(el)) {
    gsap.set(el, { transformPerspective: 1000 });
    const q = ["rotationX", "rotationY", "y"].map((p) => gsap.quickTo(el, p, { duration: 0.6, ease: "power3.out" }));
    tilts.set(el, (rx, ry, y) => { q[0](rx); q[1](ry); q[2](y); });
  }
  const r = el.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
  const k = Math.min(1, 420 / Math.max(r.width, r.height));   // büyük kartlar daha az eğilir
  tilts.get(el)(-py * 9 * k, px * 11 * k, -6);
  activeTilt = el;
}, { passive: true });

function Apps({ apps, releases }) {
  // Düğme hemen değişir; liste önce kısaca söner, sonra yeni kartlar sırayla belirir.
  // Kapsayıcının yüksekliği eski değerden yeniye yumuşakça geçer, böylece alttaki içerik zıplamaz.
  const [kind, setKind] = useState("all"), [sort, setSort] = useState("new");
  const [shown, setShown] = useState({ kind: "all", sort: "new" });
  const box = useRef(null), prevH = useRef(0);
  const change = (key, set) => (v) => {
    set(v);
    const cards = box.current?.querySelectorAll("[data-flip-id]");
    if (reducedMotion() || !cards?.length) { setShown((o) => ({ ...o, [key]: v })); return; }
    gsap.to(cards, { autoAlpha: 0, y: -8, duration: 0.16, ease: "power1.in", overwrite: true,
      onComplete: () => { prevH.current = box.current?.offsetHeight || 0; setShown((o) => ({ ...o, [key]: v })); } });
  };
  useLayoutEffect(() => {
    const el = box.current, h = prevH.current; prevH.current = 0;
    if (!el || !h) return;
    gsap.fromTo(el, { height: h }, { height: el.offsetHeight, duration: 0.35, ease: "power2.out", clearProps: "height" });
    gsap.fromTo(el.querySelectorAll("[data-flip-id]"), { autoAlpha: 0, y: 14 },
      { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.05, clearProps: "opacity,visibility,transform" });
  }, [shown]);
  let list = apps.filter((a) => shown.kind === "all" || (shown.kind === "portable" ? isPortable(a) : !isPortable(a)));
  if (shown.sort === "popular") list = [...list].sort((a, b) => downloadsOf(releases, b.id) - downloadsOf(releases, a.id));

  return html`<${VStack} gap=${8}>
    <${PageHead} title="Uygulamalar" end=${html`
      <${SegmentedControl} label="Türe göre" value=${kind} onChange=${change("kind", setKind)}>
        <${SegmentedControlItem} value="all" label="Tümü" />
        <${SegmentedControlItem} value="installer" label="Kurulum" icon=${html`<${Ico} icon=${Package} />`} />
        <${SegmentedControlItem} value="portable" label="Taşınabilir" icon=${html`<${Ico} icon=${FolderArchive} />`} />
      <//>
      <${SegmentedControl} label="Sıralama" value=${sort} onChange=${change("sort", setSort)}>
        <${SegmentedControlItem} value="new" label="En yeni" />
        <${SegmentedControlItem} value="popular" label="En çok indirilen" />
      <//>`}>
      ${apps.length} uygulama · hepsi ücretsiz, hepsi Windows için.
    <//>
    ${list.length
      ? html`<div class="stagger" ref=${box}><${Grid} columns=${{ minWidth: 320, repeat: "fit" }} gap=${5}>${list.map((a) => html`<${AppCard} key=${a.id} app=${a} releases=${releases} />`)}<//></div>`
      : html`<${EmptyState} title="Bu türde uygulama yok" description="Başka bir tür seç." icon=${html`<${Ico} icon=${Package} size="lg" />`} />`}
  <//>`;
}

// ---------- tek uygulama (İndir düğmesi yalnızca burada) ----------
function VersionHistory({ app, releases }) {
  if (releases === false) return html`<${Text}>Sürüm geçmişi şu an alınamadı. <${Link} type="inherit" href=${app.release}>GitHub'da gör<//><//>`;
  if (!releases) return html`<${VStack} gap=${2}><${Skeleton} height=${20} /><${Skeleton} height=${20} index=${1} /><//>`;
  const list = releases.filter((r) => r.id === app.id).map((r, i) => ({ ...r, key: r.v, current: i === 0 }));
  if (!list.length) return html`<${Text} color="secondary">Henüz kayıtlı sürüm yok.<//>`;
  const columns = [
    { key: "v", header: "Sürüm", renderCell: (r) => html`<${HStack} gap=${2} vAlign="center"><${Text} weight="semibold">v${r.v}<//>${r.current ? html`<${Badge} variant="success" label="Güncel" />` : null}<//>` },
    { key: "t", header: "Tarih", renderCell: (r) => fmtDate(r.t) },
    { key: "n", header: "İndirme", align: "end", renderCell: (r) => html`<${Text} hasTabularNumbers>${fmtNum(r.n)}<//>` },
  ];
  return html`<${Table} data=${list} columns=${columns} idKey="key" density="compact" />`;
}

function AppPage({ apps, releases, id }) {
  const a = apps.find((x) => x.id === id);
  useEffect(() => { document.title = (a ? a.name : "Bulunamadı") + " · Uygulamalarım"; }, [a]);
  if (!a) return html`<${EmptyState} title="Bu uygulama bulunamadı" description="Bağlantı eski olabilir."
    actions=${html`<${Button} label="Tüm uygulamalar" variant="primary" href="#/uygulamalar" />`} />`;
  const [kindLabel, kindHint] = kindOf(a);
  const file = a.download.split("/").pop();

  return html`<${VStack} gap=${6}>
    <${HStack}><${Button} label="Tüm uygulamalar" variant="ghost" href="#/uygulamalar" icon=${html`<${Ico} icon=${ArrowLeft} />`} /><//>
    <${Grid} columns=${{ minWidth: 340, repeat: "fit" }} gap=${8} align="start">
      <div class="rise"><${Card} variant="muted" padding=${0}>
        <${AspectRatio} ratio=${1}>
          <div class="stage"><div class="halo" /><${Tile3D} key=${a.id} src=${a.icon} alt=${a.name + " simgesi"} /></div>
        <//>
      <//></div>

      <div class="rise rise-2"><${VStack} gap=${6}>
        <${VStack} gap=${3}>
          <${Heading} level=${1} type="display-2">${a.name}<//>
          <${KindBadges} app=${a} releases=${releases} withDownloads=${true} />
        <//>
        <${Text} type="large" weight="normal" textWrap="pretty">${a.description}<//>
        <${VStack} gap=${2} hAlign="start">
          <span class="shine"><${Button} label="İndir" variant="primary" size="lg" href=${a.download}
            icon=${html`<${Ico} icon=${Download} color="inherit" />`} /></span>
          <${Text} type="supporting" color="secondary">${file}<//>
        <//>
        <${Banner} status="info" title=${kindLabel} collapsible=${false}
          description=${kindHint + " İlk kez kuruyorsan kurulum rehberine göz at."}
          endContent=${html`<${Button} label="Kurulum rehberi" size="sm" href="#/kurulum" />`} />
        <${MetadataList} label=${{ position: "start", width: 140 }}>
          <${MetadataListItem} label="Sürüm">v${a.version}<//>
          <${MetadataListItem} label="Platform">${a.platform || "Windows"}<//>
          <${MetadataListItem} label="Tür">${kindLabel}<//>
          ${a.size ? html`<${MetadataListItem} label="Boyut">${fmtSize(a.size)}<//>` : null}
          <${MetadataListItem} label="Yayın tarihi">${fmtDate(a.date)}<//>
          ${releases !== false ? html`<${MetadataListItem} label="İndirme">${dlText(releases, a.id)}<//>` : null}
        <//>

        <${CollapsibleGroup} type="multiple" defaultValue=${["features", "history"]}>
          <${Divider} />
          ${(a.features || []).length > 0 && html`
            <${Collapsible} value="features" trigger=${html`<${Heading} level=${3}>Neler yapar<//>`}>
              <${VStack} gap=${2}>
                ${a.features.map((f) => html`<${HStack} key=${f} gap=${2} vAlign="start">
                  <${Ico} icon=${Check} color="secondary" /><${Text}>${f}<//>
                <//>`)}
              <//>
            <//>
            <${Divider} />`}
          <${Collapsible} value="history" trigger=${html`<${Heading} level=${3}>Sürüm geçmişi<//>`}>
            <${VersionHistory} app=${a} releases=${releases} />
          <//>
          <${Divider} />
          ${a.sha256 && html`
            <${Collapsible} value="hash" defaultIsOpen=${false} trigger=${html`<${Heading} level=${3}>Dosya doğrulama<//>`}>
              <${VStack} gap=${3}>
                <${Text} color="secondary">İndirdiğin dosyanın SHA-256 değeri bununla aynı olmalı.<//>
                <${CodeBlock} code=${a.sha256} title="SHA-256" hasLanguageLabel=${false} isWrapped=${true} width="100%" size="sm" />
              <//>
            <//>
            <${Divider} />`}
        <//>
      <//></div>
    <//>
  <//>`;
}

// ---------- kurulum rehberi ----------
const STEPS = [
  [Download, "Dosyayı indir", html`Uygulamanın sayfasındaki <b>İndir</b> düğmesine bas. Dosya GitHub üzerinden, doğrudan bilgisayarına iner. Dosyanın değişmediğinden emin olmak istersen sayfadaki SHA-256 değerini aşağıdaki gibi karşılaştırabilirsin.`],
  [MousePointerClick, "Windows uyarısını geç", html`Uygulamalar dijital imzasız olduğu için Windows <b>“Bilgisayarınız korundu”</b> diyebilir. <b>Ek bilgi</b> yazısına, sonra <b>Yine de çalıştır</b> düğmesine bas.`],
  [Package, "Kur ya da çıkar", html`<b>Kurulum</b> türündekilerde indirdiğin exe kurulum sihirbazını açar; yönetici izni istemeden senin hesabına kurulur. <b>Taşınabilir</b> olanlar zip dosyasıdır: bir klasöre çıkar, içindeki exe'yi çalıştır.`],
  [RefreshCw, "Güncel tut", html`Kurulu uygulamalar yeni sürümü kendileri bulur. Uygulamanın içindeki <b>Güncellemeleri denetle</b> düğmesine basman yeterli. Neyin ne zaman çıktığını <${Link} type="inherit" href="#/surumler">Sürümler<//> sayfasında görebilirsin.`],
  [Trash2, "Kaldır", html`Kurulum türündekiler: <b>Ayarlar → Uygulamalar → Yüklü uygulamalar</b> listesinden kaldır. Taşınabilir olanlar: çıkardığın klasörü silmen yeterli.`],
];

function Guide() {
  useEffect(() => { document.title = "Kurulum rehberi · Uygulamalarım"; }, []);
  return html`<${VStack} gap=${8}>
    <${PageHead} title="Kurulum rehberi">İndirmeden kaldırmaya kadar bilmen gereken her şey. Uygulamalar Windows 10 ve 11'de çalışır.<//>
    <div class="stagger"><${Grid} columns=${{ minWidth: 300, repeat: "fit" }} gap=${4}>
      ${STEPS.map(([icon, title, body], i) => html`<div class="spot" key=${title}><${Card} height="100%">
        <${VStack} gap=${3}>
          <${HStack} gap=${3} vAlign="center">
            <${NavIcon} icon=${html`<${Ico} icon=${icon} />`} />
            <${Text} type="supporting" color="secondary">Adım ${i + 1}<//>
          <//>
          <${Heading} level=${2} type="display-3">${title}<//>
          <${Text} as="p" color="secondary">${body}<//>
        <//>
      <//></div>`)}
    <//></div>
    <div class="stagger"><${Grid} columns=${{ minWidth: 340, repeat: "fit" }} gap=${4}>
      <div class="spot"><${Card} height="100%">
        <${VStack} gap=${3}>
          <${HStack} gap=${3} vAlign="center"><${NavIcon} icon=${html`<${Ico} icon=${ShieldCheck} />`} /><${Heading} level=${2} type="display-3">Dosyayı doğrulama<//><//>
          <${Text} as="p" color="secondary">PowerShell'i aç ve indirdiğin dosya için şunu çalıştır:<//>
          <${CodeBlock} code=${'Get-FileHash "$env:USERPROFILE\\Downloads\\DOSYA_ADI.exe"'} title="PowerShell" hasLanguageLabel=${false} isWrapped=${true} width="100%" size="sm" />
          <${Text} as="p" color="secondary">Çıkan değer, uygulamanın sayfasındaki SHA-256 değeriyle aynıysa dosya bozulmamış ve değiştirilmemiş demektir.<//>
        <//>
      <//></div>
      <div class="spot"><${Card} height="100%">
        <${VStack} gap=${3}>
          <${HStack} gap=${3} vAlign="center"><${NavIcon} icon=${html`<${Ico} icon=${KeyRound} />`} /><${Heading} level=${2} type="display-3">Claude kullanan uygulamalar<//><//>
          <${Text} as="p" color="secondary">PDF Stüdyo ve Kalkan'daki yapay zekâ araçları kendi Anthropic API anahtarınla çalışır. Anahtarı uygulamanın ayarlarına girersin; anahtar yalnızca senin bilgisayarında saklanır.<//>
          <${Text} as="p" color="secondary">Anahtar girmesen de bu araçlar dışındaki her şey çalışır.<//>
        <//>
      <//></div>
    <//></div>
  <//>`;
}

// ---------- sürümler: güne göre gruplu ----------
function Releases({ apps, releases }) {
  useEffect(() => { document.title = "Sürümler · Uygulamalarım"; }, []);
  let body;
  if (releases === false) {
    body = html`<${EmptyState} title="Sürüm listesi şu an alınamadı" description="GitHub'a ulaşılamadı."
      actions=${html`<${Button} label="GitHub'da gör" href=${REPO + "/releases"} />`} />`;
  } else if (!releases) {
    body = html`<${VStack} gap=${3}>${[0, 1, 2].map((i) => html`<${Skeleton} key=${i} height=${64} index=${i} />`)}<//>`;
  } else {
    const byId = Object.fromEntries(apps.map((a) => [a.id, a]));
    const first = {};
    for (const r of releases) if (!first[r.id] || r.t < first[r.id].t) first[r.id] = r;
    const days = new Map();
    for (const r of releases) {
      const d = fmtDate(r.t);
      if (!days.has(d)) days.set(d, []);
      days.get(d).push(r);
    }
    body = html`<div class="stagger"><${VStack} gap=${6}>${[...days].map(([day, list]) => html`<${VStack} key=${day} gap=${3}>
      <${Heading} level=${2}>${day}<//>
      <${Card} padding=${2}>
        <${List} density="spacious" hasDividers>
          ${list.map((r) => {
            const a = byId[r.id];
            return html`<${Item} key=${r.id + r.v}
              href=${a ? appUrl(a) : "#/surumler"}
              startContent=${a ? html`<${AppIcon} app=${a} size=${40} />` : html`<${NavIcon} icon=${html`<${Ico} icon=${Package} />`} />`}
              label=${html`<${HStack} gap=${2} vAlign="center"><span>${a ? a.name : r.id}</span><${Badge} variant="info" label=${"v" + r.v} /><//>`}
              description=${`${first[r.id] === r ? "İlk sürüm" : "Güncelleme"} · ${fmtTime(r.t)}`}
              endContent=${html`<${Text} type="supporting" color="secondary" hasTabularNumbers>${fmtNum(r.n)} indirme<//>`} />`;
          })}
        <//>
      <//>
    <//>`)}<//></div>`;
  }
  return html`<${VStack} gap=${8}>
    <${PageHead} title="Sürümler">Yayınlanan her sürüm, en yenisi en üstte. Bir satıra basınca uygulamanın sayfası açılır.<//>
    ${body}
  <//>`;
}

// ---------- arama (Ctrl+K) ----------
function Finder({ apps, isOpen, setOpen }) {
  const items = useMemo(() => apps.map((a) => ({ id: a.id, label: a.name, app: a })), [apps]);
  const source = useMemo(() => ({
    bootstrap: () => items,
    search: (q) => {
      const t = lower(q).trim();
      return t ? items.filter(({ app: a }) => lower([a.name, a.description, ...(a.features || [])].join(" ")).includes(t)) : items;
    },
  }), [items]);
  const go = useCallback((id) => { if (id) location.hash = `#/uygulama/${encodeURIComponent(id)}`; }, []);
  return html`<${CommandPalette} isOpen=${isOpen} onOpenChange=${setOpen} searchSource=${source}
    label="Uygulama ara" emptySearchText="Eşleşen uygulama yok." emptyBootstrapText="Uygulama ya da özellik ara"
    value="" onValueChange=${go}
    renderItem=${(item) => html`<${HStack} gap=${3} vAlign="center" style=${{ minWidth: 0, maxWidth: "100%", overflow: "hidden" }}>
      <${AppIcon} app=${item.app} size=${32} />
      <${VStack} gap=${0} style=${{ minWidth: 0, flex: 1 }}>
        <${Text} weight="semibold">${item.app.name}<//>
        <${Text} type="supporting" color="secondary" maxLines=${1}>${item.app.description}<//>
      <//>
    <//>`} />`;
}

// ---------- uygulama kabuğu ----------
function App() {
  const [apps, setApps] = useState(null);       // null = yükleniyor, false = hata
  const [releases, setReleases] = useState(null);
  const [finder, setFinder] = useState(false);
  const route = useRoute();
  // Kartlar ve bölümler kaydırıldıkça sırayla yükselerek belirir (ScrollTrigger.batch).
  useGSAP(() => {
    if (reducedMotion()) return;
    const root = document.querySelector(".page-vt");
    const items = root ? gsap.utils.toArray(root.querySelectorAll(".stagger > * > *")) : [];
    if (!items.length) return;
    gsap.set(items, { autoAlpha: 0, y: 28 });
    ScrollTrigger.batch(items, { scroller: scrollerOf(root), start: "top 94%", once: true,
      onEnter: (b) => gsap.to(b, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out", stagger: 0.08, overwrite: true,
        clearProps: "transform,opacity,visibility" }) });
  }, { dependencies: [route.view, route.id, !!apps, route.view === "releases" && !!releases], revertOnUpdate: true });
  const [scheme, toggleScheme] = useScheme();
  const [theme, setTheme] = useTheme();

  useEffect(() => {
    fetch("apps.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((data) => {
        setApps(data.sort((a, b) => new Date(b.date) - new Date(a.date)));
        loadReleases().then(setReleases).catch(() => setReleases(false));
      })
      .catch(() => setApps(false));
  }, []);

  useEffect(() => {
    const on = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setFinder((v) => !v); }
    };
    document.addEventListener("keydown", on);
    return () => document.removeEventListener("keydown", on);
  }, []);

  useEffect(() => {
    if (route.view === "home") document.title = "Uygulamalarım";
    if (route.view === "apps") document.title = "Uygulamalar · Uygulamalarım";
  }, [route.view]);

  const nav = route.view === "app" ? "apps" : route.view;
  useNavPill([nav, theme]);
  const topNav = html`<${TopNav} label="Ana menü"
    heading=${html`<${TopNavHeading} heading="Uygulamalarım" headingHref="#/"
      logo=${html`<${NavIcon} icon=${html`<${Ico} icon=${LayoutGrid} />`} />`} />`}
    centerContent=${html`
      <${TopNavItem} label="Uygulamalar" href="#/uygulamalar" isSelected=${nav === "apps"} />
      <${TopNavItem} label="Kurulum" href="#/kurulum" isSelected=${nav === "guide"} />
      <${TopNavItem} label="Sürümler" href="#/surumler" isSelected=${nav === "releases"} />`}
    endContent=${html`
      <${ThemeMenu} theme=${theme} setTheme=${setTheme} />
      <${IconButton} label="Uygulama ara" tooltip="Ara (Ctrl+K)" variant="ghost"
        icon=${html`<${Ico} icon=${Search} />`} onClick=${() => setFinder(true)} />
      <${IconButton} label=${scheme === "dark" ? "Açık temaya geç" : "Koyu temaya geç"} tooltip=${scheme === "dark" ? "Açık tema" : "Koyu tema"}
        variant="ghost" icon=${html`<${Ico} icon=${scheme === "dark" ? Sun : Moon} />`} onClick=${toggleScheme}
        isDisabled=${theme === "gothic"} />`} />`;

  let page;
  if (apps === null) {
    page = html`<${VStack} gap=${6}><${Skeleton} height=${48} width="50%" /><${Grid} columns=${{ minWidth: 320, repeat: "fit" }} gap=${5}>
      ${[0, 1, 2].map((i) => html`<${Skeleton} key=${i} height=${200} index=${i} />`)}<//><//>`;
  } else if (apps === false) {
    page = html`<${EmptyState} title="Liste yüklenemedi" description="Sayfayı yenilemeyi dene."
      actions=${html`<${Button} label="Yenile" variant="primary" onClick=${() => location.reload()} />`} />`;
  } else {
    page = {
      home: html`<${Home} apps=${apps} releases=${releases} />`,
      apps: html`<${Apps} apps=${apps} releases=${releases} />`,
      app: html`<${AppPage} apps=${apps} releases=${releases} id=${route.id} />`,
      guide: html`<${Guide} />`,
      releases: html`<${Releases} apps=${apps} releases=${releases} />`,
    }[route.view];
  }

  return html`<${AppShell} variant="surface" contentPadding=${6} topNav=${topNav}>
    <${Layout} height="auto" contentWidth=${1200} content=${html`<${LayoutContent} isScrollable=${false}>
      <${VStack} gap=${10} paddingBlockEnd=${6}>
        <div class="page-vt">${page}</div>
        <${VStack} gap=${4}>
          <${Divider} />
          <${Text} type="supporting" color="secondary">
            Yusuf Cihan · Dosyalar <${Link} type="inherit" href=${REPO + "/releases"}>GitHub Releases<//> üzerinden indirilir.
          <//>
        <//>
      <//>
    <//>`} />
    <div class="topline" aria-hidden="true" />
    <${GridBG} />
    ${Array.isArray(apps) && html`<${Finder} apps=${apps} isOpen=${finder} setOpen=${setFinder} />`}
  <//>`;
}

createRoot(document.getElementById("root")).render(html`<${InternationalizationProvider} locale="tr-TR" messages=${{ "tr-TR": trTR }}>
  <${App} />
<//>`);
</script>
</body>
</html>
